env:
  node: true
  es2021: true
extends:
  - eslint:recommended
  - plugin:@typescript-eslint/recommended
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: 12
  sourceType: module
plugins:
  - "@typescript-eslint"
rules:
  no-unsafe-optional-chaining:
    - error
  dot-location:
    - off
  eqeqeq:
    - error
    - always
  no-multi-spaces:
    - error
    - ignoreEOLComments: false
  no-multi-str:
    - error
  no-trailing-spaces:
    - error
    - skipBlankLines: false
      ignoreComments: false
  require-await:
    - error
  brace-style:
    - error
    - 1tbs
  comma-dangle:
    - error
    - never
  comma-spacing:
    - error
    - before: false
      after: true
  eol-last:
    - error
    - always
  indent:
    - error
    - 2
    - SwitchCase: 1
  linebreak-style:
    - error
    - unix
  no-tabs:
    - error
    - allowIndentationTabs: false
  quotes:
    - error
    - double
  semi:
    - error
    - always
  spaced-comment:
    - error
    - always
  no-var:
    - error
